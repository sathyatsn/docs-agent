# Slack app manifest for the release ticket bot.
# api.slack.com/apps -> Create New App -> From an app manifest -> paste this.
display_information:
  name: Release Tickets
  description: Creates Jira release epics and tasks from a one-line request, after approval.
features:
  bot_user:
    display_name: release-tickets
    always_online: true
  slash_commands:
    - command: /release
      description: Plan Jira release tickets for approval
      usage_hint: "SGW 4.1.4 GA Dec 10"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
